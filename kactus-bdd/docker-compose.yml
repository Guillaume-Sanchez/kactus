services:
  kactus-bdd:
    image: mariadb:11.8
    container_name: kactus-bdd
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
      - /opt/kactus/kactus-bdd/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - kactus-private

volumes:
  mariadb_data:

networks:
  kactus-private:
    external: true